version: '3.8'

services:
  manetho:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: manetho-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Environment variables should be passed via .env file or deployment secrets
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - manetho-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - manetho-logs:/app/.next/cache

  nginx:
    image: nginx:alpine
    container_name: manetho-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      manetho:
        condition: service_healthy
    networks:
      - manetho-network
    restart: unless-stopped
    profiles:
      - with-nginx

networks:
  manetho-network:
    driver: bridge

volumes:
  manetho-logs: 