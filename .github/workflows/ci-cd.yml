name: CI & CD and testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/manetho
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: |
          cat <<EOF > .env
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLERK_WEBHOOK_KEY=${{ secrets.CLERK_WEBHOOK_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT=${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          NEXT_PUBLIC_AGORA_APP_ID=${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}
          PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY=${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}
          NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/manetho
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: |
          cat <<EOF > .env
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLERK_WEBHOOK_KEY=${{ secrets.CLERK_WEBHOOK_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT=${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          NEXT_PUBLIC_AGORA_APP_ID=${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}
          PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY=${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}
          NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
          EOF
          cp .env .env.local

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}

      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts

      # Ensure deployment directory exists and copy files
      - name: Copy compose & env to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} "mkdir -p ~/manetho"
          scp -o StrictHostKeyChecking=no .env ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:~/manetho/.env

      - name: Create docker-compose.yml on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} "cat > ~/manetho/docker-compose.yml << 'EOF'
          version: \"3.9\"
          services:
            manetho:
              image: \${DOCKERHUB_USERNAME}/manetho:latest
              ports:
                - \"4000:4000\"
              env_file:
                - .env
              restart: unless-stopped
          EOF"

      - name: Deploy on VM via SSH
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} << 'EOF'
            set -euo pipefail
            
            # Check if Docker is running
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: Docker is not running or accessible"
              exit 1
            fi
            
            # Login to Docker Hub securely
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            cd ~/manetho
            
            # Set environment variable for compose
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Pull latest image with retry
            for i in {1..3}; do
              if docker pull "${{ env.IMAGE_NAME }}:latest"; then
                break
              fi
              echo "Pull attempt $i failed, retrying..."
              sleep 5
            done
            
            # Deploy with compose
            docker-compose down 2>/dev/null || true
            docker-compose up -d --remove-orphans
            
            # Wait for container to start
            sleep 10
            
            # Verify deployment
            if docker-compose ps | grep -q "Up"; then
              echo "✅ Deployment successful!"
              docker-compose ps
            else
              echo "❌ Deployment failed!"
              docker-compose logs
              exit 1
            fi
            
            # Cleanup old images to save space
            docker image prune -f
          EOF
