name: CI & CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/manetho
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Manetho/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Manetho

      - name: Run lint (non-blocking)
        run: npm run lint || true
        working-directory: Manetho

      - name: Create build environment
        run: |
          cat <<EOF > Manetho/.env
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLERK_WEBHOOK_KEY=${{ secrets.CLERK_WEBHOOK_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT=${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          NEXT_PUBLIC_AGORA_APP_ID=${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Manetho
          file: ./Manetho/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/manetho
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: |
          cat <<EOF > .env
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLERK_WEBHOOK_KEY=${{ secrets.CLERK_WEBHOOK_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT=${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          NEXT_PUBLIC_AGORA_APP_ID=${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}
          EOF
          cp .env .env.local

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}

      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts

      # Ensure deployment directory exists and copy files
      - name: Copy compose & env to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} "mkdir -p ~/manetho"
          scp -o StrictHostKeyChecking=no "${{ github.workspace }}/Manetho/docker-compose.yml" ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:~/manetho/docker-compose.yml
          scp -o StrictHostKeyChecking=no .env ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:~/manetho/.env

      - name: Deploy on VM via SSH
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} << EOF
            set -euo pipefail
            
            # Check if Docker is running
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: Docker is not running or accessible"
              exit 1
            fi
            
            # Login to Docker Hub
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            
            cd ~/manetho
            
            # Pull latest image with retry
            for i in {1..3}; do
              if docker pull "${IMAGE_NAME}:latest"; then
                break
              fi
              echo "Pull attempt \$i failed, retrying..."
              sleep 5
            done
            
            # Stop and remove old container (ignore errors)
            docker stop manetho 2>/dev/null || true
            docker rm manetho 2>/dev/null || true
            
            # Check if port 4000 is available
            if netstat -tuln | grep -q ":4000 "; then
              echo "WARNING: Port 4000 is already in use"
              # Kill any process using port 4000
              fuser -k 4000/tcp 2>/dev/null || true
              sleep 2
            fi
            
            # Run new container with restart policy
            docker run -d \
              --name manetho \
              --restart unless-stopped \
              --env-file .env \
              -p 4000:4000 \
              "${IMAGE_NAME}:latest"
            
            # Wait for container to start
            sleep 5
            
            # Verify deployment
            if docker ps --filter name=manetho --filter status=running | grep -q manetho; then
              echo "✅ Deployment successful!"
              docker ps --filter name=manetho
            else
              echo "❌ Deployment failed!"
              docker logs manetho --tail 20
              exit 1
            fi
            
            # Cleanup old images to save space
            docker image prune -f
          EOF
